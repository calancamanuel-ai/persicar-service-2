<!doctype html>

<title>Modello officina</title>
<style>
  :root { --bg: #15161a; --ink: #f2f2f0; --muted: #a5a6ad; --panel: rgba(20,21,26,0.88); }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #eceae6; --ink: #1d1d20; --muted: #5e5f66; --panel: rgba(255,255,255,0.9); } }
  :root[data-theme="light"] { --bg: #eceae6; --ink: #1d1d20; --muted: #5e5f66; --panel: rgba(255,255,255,0.9); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  .ui { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }

  .ui h1 { font-size: 15px; margin: 0 8px 0 0; padding: 8px 12px; background: var(--panel); border-radius: 10px; }
  .ui button { font: inherit; border: 1px solid rgba(128,128,128,0.35); background: var(--panel); color: var(--ink); padding: 8px 12px; border-radius: 10px; cursor: pointer; min-height: 40px; }
  .ui button.on { outline: 2px solid #1fa35c; }
  .hint { position: fixed; left: 12px; bottom: 12px; padding: 8px 12px; background: var(--panel); border-radius: 10px; color: var(--muted); font-size: 13px; }
  .lbl { position: absolute; transform: translate(-50%, -100%); padding: 3px 7px; border-radius: 6px; background: rgba(0,0,0,0.72); color: #fff; font-size: 12px; white-space: nowrap; pointer-events: none; }
  body.nolabels .lbl { display: none; }
</style>
</head>
<body>
<div class="ui">
  <h1>Persicar Service · modello dell'officina</h1>
  <button data-view="iso" class="on">Spaccato</button>
  <button data-view="door">Dal portone</button>
  <button data-view="top">Pianta</button>
  <button data-view="out">Esterno</button>
  <button id="lbl">Etichette</button>
</div>
<div class="hint">Trascina per ruotare · rotella o due dita per lo zoom</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// Coordinate in metri dalla pianta: x lungo il capannone (0 = muro bagno/sgabuzzino), z = distanza dal muro di fondo (0) verso la facciata (13).
const D = 13, HALL = 21.5, L = 26.5, WALL_H = 4.6, RIDGE = 6.2;
const params = new URLSearchParams(location.search);
if (params.get("labels") === "0") document.body.classList.add("nolabels");

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15161a);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.9));
const sun = new THREE.DirectionalLight(0xfff2e0, 1.6);
sun.position.set(8, 20, 25); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25 });
scene.add(sun);

const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, metalness: 0.05, ...o });
const mat = {
  floor: M(0xb9876a), floorB: M(0x9a9996), wall: M(0xe9e3d8), pink: M(0xe0a58e), roof: M(0xa8452f),
  room: M(0xf3efe8), red: M(0xc8252b, { roughness: 0.45 }), blue: M(0x2f55b8, { roughness: 0.5 }),
  rubber: M(0x161616, { roughness: 0.95 }), grate: M(0x8b8f96, { metalness: 0.6, wireframe: true }),
  tools: M(0xb5322f, { roughness: 0.5 }), toolsG: M(0x7d8087), door: M(0x9aa0a6, { metalness: 0.5 }),
  glass: M(0x3a5f8a, { roughness: 0.2, metalness: 0.3 }), white: M(0xf4f4f2, { roughness: 0.35, metalness: 0.2 }),
  grey: M(0x4b4f55, { roughness: 0.4, metalness: 0.3 }), silver: M(0xb8bcc2, { roughness: 0.35, metalness: 0.5 }),
  machine: M(0x2b2e33, { roughness: 0.5 }), wood: M(0x8a6a48),
};
const P = (x, z) => new THREE.Vector3(x, 0, z);
function box(w, h, d, m, x, y, z, parent = scene) {
  const g = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  g.position.set(x, y, z); g.castShadow = g.receiveShadow = true; parent.add(g); return g;
}
const labels = [];
function label(text, x, y, z) {
  const el = document.createElement("div"); el.className = "lbl"; el.textContent = text;
  document.getElementById("labels").appendChild(el); labels.push({ el, p: new THREE.Vector3(x, y, z) });
}

// Pavimento
box(L + 3.5, 0.1, D, mat.floor, (L - 3.5) / 2, -0.05, D / 2);
box(60, 0.05, 30, mat.floorB, L / 2, -0.12, D + 12);

// Muri perimetrali (la facciata è un gruppo a parte, per poterla nascondere nello spaccato)
const T = 0.3;
box(L + 3.5, WALL_H, T, mat.wall, (L - 3.5) / 2, WALL_H / 2, -T / 2);           // fondo
box(T, WALL_H, D, mat.wall, L + T / 2, WALL_H / 2, D / 2);                       // lato destro
box(T, WALL_H, D, mat.wall, -3.5 - T / 2, WALL_H / 2, D / 2);                    // confine con la palestra
const facade = new THREE.Group(); scene.add(facade);
const fz = D + T / 2;
box(16, WALL_H, T, mat.pink, 8 - 3.5 / 2 - 0.25, WALL_H / 2, fz, facade);          // da -3.5 a 16
box(L - 21, WALL_H, T, mat.pink, 21 + (L - 21) / 2, WALL_H / 2, fz, facade);       // da 21 a 26.5
box(5, WALL_H - 3.6, T, mat.pink, 18.5, 3.6 + (WALL_H - 3.6) / 2, fz, facade);     // sopra il portone
for (const wx of [1.5, 5.5, 9.5, 13.2, 23.8]) {
  box(2.4, 1.4, 0.08, mat.glass, wx, 2.6, fz + 0.16, facade);
  for (let i = 0; i <= 6; i++) box(0.04, 1.5, 0.05, mat.grey, wx - 1.2 + i * 0.4, 2.6, fz + 0.24, facade);
  for (let j = 0; j <= 3; j++) box(2.45, 0.04, 0.05, mat.grey, wx, 1.9 + j * 0.47, fz + 0.24, facade);
}
for (const wx of [2, 6.2, 12, 16.4, 20.6]) { box(3.2, 1.0, 0.06, mat.glass, wx, 3.7, 0.0); box(3.3, 1.1, 0.04, mat.blue, wx, 3.7, -0.02); }
// volta interna con neon: asse parallelo alla facciata, visibile nella vista dal portone
const vault = new THREE.Group(); scene.add(vault);
{
  // volta a botte: sezione ad arco nel piano y-z, asse lungo x (parallelo alla facciata)
  const span = D, rise = 1.6, n = 24, vm = M(0xe8e0d2, { side: THREE.DoubleSide });
  const Rv = (span * span / 4 + rise * rise) / (2 * rise), cy = WALL_H + rise - Rv, a0 = Math.asin((span / 2) / Rv);
  for (let i = 0; i < n; i++) {
    const t0 = -a0 + (2 * a0) * i / n, t1 = -a0 + (2 * a0) * (i + 1) / n, tm = (t0 + t1) / 2;
    const seg = 2 * Rv * Math.sin((t1 - t0) / 2) + 0.02;
    const zc = D / 2 + Rv * Math.sin(tm), yc = cy + Rv * Math.cos(tm);
    const sgm = box(L + 3.5, 0.08, seg, vm, (L - 3.5) / 2, yc, zc, vault); sgm.rotation.x = tm; sgm.castShadow = false;
  }
  for (let rx = -3.5; rx <= L; rx += 4.5) for (let i = 0; i < n; i++) {
    const t0 = -a0 + (2 * a0) * i / n, t1 = -a0 + (2 * a0) * (i + 1) / n, tm = (t0 + t1) / 2;
    const seg = 2 * Rv * Math.sin((t1 - t0) / 2) + 0.02;
    const r = box(0.18, 0.2, seg, M(0xcfc6b6), rx, cy + (Rv - 0.12) * Math.cos(tm), D / 2 + (Rv - 0.12) * Math.sin(tm), vault); r.rotation.x = tm;
  }
  for (const tz of [3, 6.5, 10]) for (let tx = 0; tx < L; tx += 3.2) {
    const t = box(1.5, 0.06, 0.12, M(0xffffff, { emissive: 0xfff6e0, emissiveIntensity: 1.2 }), tx + 1, WALL_H + 1.25 - Math.pow(Math.abs(tz - 6.5), 2) * 0.03, tz, vault);
  }
}
const slide = box(5, 3.6, 0.12, mat.door, 13.6, 1.8, fz + 0.3, facade);             // anta scorrevole aperta a sinistra
// Tetto a falde (colmo parallelo alla facciata)
const roof = new THREE.Group(); scene.add(roof);
{
  const W = L + 3.5 + 0.8, half = D / 2 + 0.6, rise = RIDGE - WALL_H, slope = Math.hypot(half, rise);
  for (const s of [-1, 1]) {
    const r = box(W, 0.18, slope, mat.roof, (L - 3.5) / 2, WALL_H + rise / 2, D / 2 + s * half / 2, roof);
    r.rotation.x = s * Math.atan2(rise, half);
  }
}

// Annesso: sgabuzzino e bagno (più stretto del capannone), porte vicine al muro in comune
box(T, WALL_H, D - 1.6, mat.wall, -T / 2, WALL_H / 2, 1.6 + (D - 1.6) / 2).visible = false;
const annexWall = (z0, z1) => box(0.15, 2.8, z1 - z0, mat.room, 0, 1.4, (z0 + z1) / 2);
annexWall(1.6, 5.7); annexWall(6.6, 7.4); annexWall(8.3, D);
box(3.5, 2.8, 0.15, mat.room, -1.75, 1.4, 1.6);
box(3.5, 2.8, 0.15, mat.room, -1.75, 1.4, 7.0);
box(3.5, 0.1, D - 1.6, mat.room, -1.75, 2.85, 1.6 + (D - 1.6) / 2);
label("Sgabuzzino", -1.75, 3.2, 4.3); label("Bagno", -1.75, 3.2, 10);

// Stanze a destra: sala attesa, ufficio, accettazione (porta laterale), con sottotetto gomme sopra la sala attesa
const RX = HALL, RH = 2.8;
const rw = (z0, z1) => box(0.15, RH, z1 - z0, mat.room, RX, RH / 2, (z0 + z1) / 2);
rw(2.3, 3.4); rw(4.3, 10.8); rw(11.8, D);
box(L - RX, RH, 0.15, mat.room, RX + (L - RX) / 2, RH / 2, 2.3);
box(L - RX, RH, 0.15, mat.room, RX + (L - RX) / 2, RH / 2, 5.4);
box(2.4, RH, 0.15, mat.room, RX + 1.2, RH / 2, 9.0); box(1.7, RH, 0.15, mat.room, RX + 4.15, RH / 2, 9.0);
box(L - RX, 0.12, 5.4 - 2.3, mat.room, RX + (L - RX) / 2, RH + 0.06, 2.3 + (5.4 - 2.3) / 2); // solaio del sottotetto, solo sopra la sala d'attesa
// arredi stanze
// sala d'attesa: divanetto e tavolino
box(2.2, 0.45, 0.8, M(0x2d2f36), RX + 2.6, 0.22, 3.0); box(2.2, 0.5, 0.15, M(0x2d2f36), RX + 2.6, 0.7, 2.65); box(0.9, 0.4, 0.6, mat.wood, RX + 2.6, 0.2, 4.4);
// ufficio: scrivania, sedia, monitor, armadio
box(1.6, 0.75, 0.8, mat.wood, RX + 2.4, 0.375, 7.0); box(0.5, 0.45, 0.5, M(0x222428), RX + 2.4, 0.25, 7.8);
box(0.6, 0.4, 0.05, M(0x111111), RX + 2.4, 0.97, 6.75); box(0.6, 1.9, 2.2, M(0xc9c3b8), RX + 4.6, 0.95, 7.2);
// accettazione: bancone verso la porta, sedie per i clienti
box(0.7, 1.05, 2.4, mat.wood, RX + 2.2, 0.52, 11.2); box(0.6, 0.4, 0.05, M(0x111111), RX + 2.8, 1.25, 11.2);
for (const cz of [10.4, 12.0]) box(0.45, 0.45, 0.45, M(0x2d2f36), RX + 1.2, 0.23, cz);
label("Sala d'attesa", RX + 2.5, 3.4, 3.9); label("Ufficio", RX + 2.5, 3.4, 7.2); label("Accettazione", RX + 2.5, 3.4, 11.2);
// pneumatici nel sottotetto sopra la sala d'attesa (con ringhiera)
for (let i = 0; i < 6; i++) for (let k = 0; k < 2; k++) {
  const t = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.33, 0.9, 20), mat.rubber);
  t.position.set(RX + 0.7 + i * 0.75, RH + 0.12 + 0.45, 3.2 + k * 1.2); t.castShadow = true; scene.add(t);
}
box(L - RX, 0.9, 0.05, mat.silver, RX + (L - RX) / 2, RH + 0.6, 2.32);
label("Sottotetto pneumatici", RX + 2.5, 4.5, 3.8);
// scala a pioli tra sala attesa e muro di fondo
{
  const lx = 25.6, lz = 1.6;
  for (const dx of [-0.25, 0.25]) box(0.06, RH + 0.9, 0.06, mat.silver, lx + dx, (RH + 0.9) / 2, lz);
  for (let i = 0; i < 9; i++) box(0.5, 0.04, 0.04, mat.silver, lx, 0.35 + i * 0.36, lz);
  label("Scala a pioli", lx, RH + 1.4, lz);
}
// strumenti nella fascia dietro la sala d'attesa
box(2.4, 1.0, 0.6, mat.tools, RX + 1.6, 0.5, 0.45);

// Muro di fondo: strumenti (tranne portone piccolo e postazione gomme)
box(7.0, 1.0, 0.6, mat.tools, 3.5, 0.5, 0.45); box(7.0, 1.2, 0.05, mat.toolsG, 3.5, 1.9, 0.03);
box(3.6, 1.0, 0.6, mat.tools, 12.0, 0.5, 0.45); box(3.6, 1.2, 0.05, mat.toolsG, 12.0, 1.9, 0.03);
box(0.6, 1.0, 4.2, mat.tools, 0.45, 0.5, 2.1);
label("Strumenti", 3.5, 2.8, 0.5);
// portone piccolo verso il giardino interno
box(2.8, 2.8, 0.1, mat.door, 8.6, 1.4, 0.02);
label("Portone sul giardino", 8.6, 3.2, 0.3);

// Postazione gomme: smontagomme ed equilibratrice lungo il muro di fondo
function tyreChanger(x, z) {
  const c = M(0xc02a2a, { roughness: 0.45 });
  box(1.0, 0.9, 1.2, c, x, 0.45, z);
  const tt = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.1, 32), mat.silver); tt.position.set(x, 0.96, z + 0.1); scene.add(tt);
  const tyre = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.13, 12, 32), mat.rubber); tyre.rotation.x = Math.PI / 2; tyre.position.set(x, 1.1, z + 0.1); scene.add(tyre);
  box(0.18, 1.5, 0.18, c, x, 1.65, z - 0.5); box(0.12, 0.12, 0.75, c, x, 2.35, z - 0.15); box(0.08, 0.6, 0.08, mat.silver, x, 2.0, z + 0.2);
}
function balancer(x, z) {
  const c = M(0xc02a2a, { roughness: 0.45 });
  box(0.9, 0.95, 0.8, c, x, 0.48, z);
  const sh = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.55, 12), mat.silver); sh.rotation.z = Math.PI / 2; sh.position.set(x + 0.7, 0.95, z + 0.1); scene.add(sh);
  const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.22, 24), mat.rubber); wh.rotation.z = Math.PI / 2; wh.position.set(x + 0.85, 0.95, z + 0.1); scene.add(wh);
  const hood = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.48, 0.3, 24, 1, true, 0, Math.PI), mat.machine); hood.rotation.z = Math.PI / 2; hood.position.set(x + 0.85, 1.05, z + 0.1); scene.add(hood);
  box(0.6, 0.4, 0.06, M(0x111111), x, 1.3, z - 0.35);
}
tyreChanger(15.5, 1.0); balancer(18.0, 0.9);
box(1.6, 1.0, 0.6, mat.tools, 20.2, 0.5, 0.45);
label("Smontagomme", 15.5, 2.6, 1.0); label("Equilibratrice", 18.0, 2.0, 0.9);

// Zona con grata e strumenti attaccati al suo lato destro
{
  const g0 = 0.9, g1 = 5.2, gz = D - 3.2;
  const gm = new THREE.MeshStandardMaterial({ color: 0x9aa0a6, metalness: 0.6, roughness: 0.5, transparent: true, opacity: 0.45 });
  box(g1 - g0, 2.4, 0.04, gm, (g0 + g1) / 2, 1.2, gz);
  box(0.04, 2.4, D - gz, gm, g1, 1.2, gz + (D - gz) / 2);
  box(0.6, 1.6, D - gz - 0.2, mat.tools, g1 + 0.35, 0.8, gz + (D - gz) / 2);
  label("Zona con grata", (g0 + g1) / 2, 2.8, gz + 1.5); label("Strumenti", g1 + 0.35, 2.0, gz + 1.6);
}

// Auto generica: body lungo l'asse locale z, muso verso +z
function car(color, len = 4.3, w = 1.8) {
  const g = new THREE.Group();
  const m = color === "white" ? mat.white : mat.grey;
  const h = len / 2, sh = new THREE.Shape();
  // profilo laterale: asse x del profilo = lunghezza (muso a +h), y = altezza
  sh.moveTo(-h, 0.3); sh.lineTo(-h, 0.85); sh.quadraticCurveTo(-h + 0.1, 0.95, -h + 0.55, 1.0);
  sh.lineTo(-h + 1.05, 1.35); sh.quadraticCurveTo(-h + 1.4, 1.42, -h + 2.2, 1.4);
  sh.lineTo(h - 1.35, 1.0); sh.quadraticCurveTo(h - 0.3, 0.92, h, 0.7); sh.lineTo(h, 0.3); sh.lineTo(-h, 0.3);
  const geo = new THREE.ExtrudeGeometry(sh, { depth: w, bevelEnabled: true, bevelSize: 0.06, bevelThickness: 0.08, bevelSegments: 3 });
  geo.translate(0, 0, -w / 2); geo.rotateY(-Math.PI / 2);
  const body = new THREE.Mesh(geo, m); body.castShadow = true; g.add(body);
  const gl = new THREE.Shape();
  gl.moveTo(-h + 1.1, 1.0); gl.lineTo(-h + 1.25, 1.3); gl.lineTo(-h + 2.15, 1.32); gl.lineTo(h - 1.45, 1.0);
  const gg = new THREE.ExtrudeGeometry(gl, { depth: w + 0.05, bevelEnabled: false }); gg.translate(0, 0, -(w + 0.05) / 2); gg.rotateY(-Math.PI / 2);
  g.add(new THREE.Mesh(gg, mat.glass));
  for (const sx of [-0.6, 0.6]) box(0.35, 0.1, 0.05, M(0xffffcc, { emissive: 0xffffaa, emissiveIntensity: 0.8 }), sx, 0.72, len / 2 + 0.05, g);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.22, 20), mat.rubber);
    wh.rotation.z = Math.PI / 2; wh.position.set(sx * (w / 2 - 0.05), 0.32, sz * (len / 2 - 0.75)); wh.castShadow = true; g.add(wh);
  }
  scene.add(g); return g;
}
// Ponte a 2 colonne: auto di traverso, muso verso la facciata (+z)
function lift2(x, z, color, raise, name) {
  for (const sx of [-1.55, 1.55]) {
    box(0.35, 3.9, 0.45, mat.red, x + sx, 1.95, z);
    box(0.7, 0.05, 0.7, mat.red, x + sx, 0.03, z);
    for (const az of [-0.9, 0.9]) box(Math.abs(sx) - 0.5, 0.07, 0.12, mat.red, x + sx * 0.6, raise + 0.1, z + az);
  }
  const c = car(color); c.position.set(x, raise, z);
  label(name, x, raise + 2.0, z);
}
lift2(4.9, 3.6, "grey", 1.6, "Ponte 1");
lift2(12.0, 3.6, "white", 0.3, "Ponte 2");
lift2(18.4, 5.4, "white", 0.25, "Ponte 3");
// Ponte a forbice blu lungo la facciata: auto parallela al muro, muso verso sinistra (-x), ruote sospese sui tamponi
{
  const x = 10.6, z = D - 2.0, h = 1.1;
  for (const dz of [-0.75, 0.75]) box(5.5, 0.14, 0.6, mat.blue, x, h, z + dz);
  for (const s of [-1, 1]) { const b = box(5.8, 0.1, 0.12, mat.blue, x, h / 2, z); b.rotation.z = s * Math.atan2(h, 5.4); }
  for (const dx of [-1.3, 1.3]) for (const dz of [-0.75, 0.75]) box(0.25, 0.22, 0.25, mat.rubber, x + dx, h + 0.18, z + dz);
  const c = car("grey"); c.rotation.y = -Math.PI / 2; c.position.set(x, h + 0.3, z);
  label("Ponte a forbice", x, h + 2.2, z);
}
label("Portone scorrevole", 18.5, 4.2, D + 0.4);

// Viste
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
const views = {
  iso:  { pos: [12, 26, 34], target: [11.5, 0, 6.5], fov: 40, cut: true },
  door: { pos: [18.5, 1.6, 12.9], target: [18.5, 2.0, 0], fov: 34, cut: true, inside: true },
  top:  { pos: [11.5, 48, 6.51], target: [11.5, 0, 6.5], fov: 35, cut: true },
  out:  { pos: [18.5, 1.7, 26], target: [18.5, 2.4, D], fov: 45, cut: false },
  end:  { pos: [18.5, 3.8, 12.6], target: [18.5, 0.8, 2], fov: 40, cut: true, inside: true },
};
function setView(name) {
  const v = views[name];
  camera.position.set(...v.pos); controls.target.set(...v.target); camera.fov = v.fov; camera.updateProjectionMatrix();
  roof.visible = !v.cut;
  vault.visible = !!v.inside;
  document.getElementById("labels").style.visibility = name === "out" ? "hidden" : "";
  facade.visible = !v.cut || !!v.inside;
  document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === name));
  controls.update();
}
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
document.getElementById("lbl").addEventListener("click", () => document.body.classList.toggle("nolabels"));
setView(params.get("view") || "iso");

const v = new THREE.Vector3();
function tick() {
  controls.update();
  renderer.render(scene, camera);
  for (const l of labels) {
    v.copy(l.p).project(camera);
    const vis = v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05;
    l.el.style.display = vis ? "" : "none";
    l.el.style.left = ((v.x + 1) / 2 * innerWidth) + "px"; l.el.style.top = ((1 - v.y) / 2 * innerHeight) + "px";
  }
  requestAnimationFrame(tick);
}
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
tick();
window.__ready = true;
</script>
